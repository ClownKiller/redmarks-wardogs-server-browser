# RedMarks Wardogs Server Browser - automatic Windows installer build
#
# Runs every time changes are pushed to the main branch (or when you press
# "Run workflow" on the Actions tab). It:
#   1. runs the automated tests (a failing test stops the build),
#   2. builds the Windows installer,
#   3. attaches the installer to the run AND publishes it on the Releases page.

name: Build Windows installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the installer on the Releases page

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Read app version
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false   # no paid code-signing certificate

      - name: Make checksum
        shell: pwsh
        run: |
          $exe = "dist/RedMarks-Wardogs-Server-Browser-Setup-${{ steps.ver.outputs.version }}.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  $(Split-Path $exe -Leaf)" | Out-File "$exe.sha256.txt" -Encoding ascii
          echo "sha256=$hash" >> $env:GITHUB_OUTPUT
        id: sum

      - name: Attach installer to this run
        uses: actions/upload-artifact@v7
        with:
          path: dist/RedMarks-Wardogs-Server-Browser-Setup-${{ steps.ver.outputs.version }}.exe
          archive: false
          if-no-files-found: error

      - name: Publish on the Releases page
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}
          name: RedMarks Wardogs Server Browser ${{ steps.ver.outputs.version }} (build ${{ github.run_number }})
          body: |
            Download **RedMarks-Wardogs-Server-Browser-Setup-${{ steps.ver.outputs.version }}.exe** below and run it.

            Windows may say "Windows protected your PC" because the app isn't signed with a paid certificate. Click **More info**, then **Run anyway**.

            **Check the download is genuine (optional).** In PowerShell, run:
            `Get-FileHash .\RedMarks-Wardogs-Server-Browser-Setup-${{ steps.ver.outputs.version }}.exe -Algorithm SHA256`
            It should print:
            `${{ steps.sum.outputs.sha256 }}`

            This installer was built automatically by GitHub from the source code in this repository.
          files: |
            dist/RedMarks-Wardogs-Server-Browser-Setup-${{ steps.ver.outputs.version }}.exe
            dist/RedMarks-Wardogs-Server-Browser-Setup-${{ steps.ver.outputs.version }}.exe.sha256.txt
          fail_on_unmatched_files: true
          make_latest: "true"
